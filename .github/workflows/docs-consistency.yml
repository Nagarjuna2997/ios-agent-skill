name: Docs Consistency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirrors are in sync with SKILL.md
        run: ./scripts/sync-mirrors.sh --check

      - name: SKILL.md frontmatter is valid
        run: |
          python3 - <<'PY'
          import sys, re

          text = open("SKILL.md", encoding="utf-8").read()
          match = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
          if not match:
              sys.exit("SKILL.md is missing its YAML frontmatter block")

          block = match.group(1)
          keys = set(re.findall(r"^([A-Za-z][A-Za-z0-9_-]*):", block, re.MULTILINE))

          required = {"name", "description", "version", "license"}
          missing = required - keys
          if missing:
              sys.exit(f"SKILL.md frontmatter is missing: {', '.join(sorted(missing))}")

          name = re.search(r"^name:\s*(.+)$", block, re.MULTILINE).group(1).strip()
          if not re.fullmatch(r"[a-z0-9-]+", name):
              sys.exit(f"skill name must be lowercase-kebab-case, got: {name!r}")

          description = re.search(r"^description:\s*(.+)$", block, re.MULTILINE).group(1).strip()
          if len(description) < 40:
              sys.exit("description must state concrete trigger conditions (>= 40 chars)")

          print(f"OK - {name} v{re.search(r'^version:\s*(.+)$', block, re.MULTILINE).group(1).strip()}")
          PY

      - name: Referenced documentation files exist
        run: |
          python3 - <<'PY'
          import os, re, sys

          # Every `path/to/doc.md` in a backticked reference inside the index files.
          sources = ["SKILL.md", "README.md"]
          pattern = re.compile(r"`((?:docs|patterns|checklists|templates|scripts)/[^`\s]+)`")

          missing = []
          for source in sources:
              if not os.path.exists(source):
                  continue
              for line_number, line in enumerate(open(source, encoding="utf-8"), 1):
                  for path in pattern.findall(line):
                      if "*" in path:
                          continue          # deliberate glob, e.g. docs/frameworks/**
                      # Directory references end in a slash.
                      target = path.rstrip("/")
                      if os.path.isdir(target) or os.path.isfile(target):
                          continue
                      missing.append(f"{source}:{line_number}: {path}")

          if missing:
              print("Referenced paths that do not exist:")
              print("\n".join(missing))
              sys.exit(1)
          print("OK - every referenced path exists")
          PY

      - name: Subagent definitions are valid
        run: |
          python3 - <<'PY'
          import glob, re, sys

          paths = sorted(glob.glob(".claude/agents/*.md"))
          if not paths:
              sys.exit(".claude/agents/ contains no subagent definitions")

          problems, names = [], {}
          for path in paths:
              text = open(path, encoding="utf-8").read()
              match = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
              if not match:
                  problems.append(f"{path}: missing YAML frontmatter")
                  continue

              block = match.group(1)
              keys = set(re.findall(r"^([A-Za-z][A-Za-z0-9_-]*):", block, re.MULTILINE))
              for required in ("name", "description"):
                  if required not in keys:
                      problems.append(f"{path}: frontmatter missing '{required}'")

              name_match = re.search(r"^name:\s*(.+)$", block, re.MULTILINE)
              if name_match:
                  name = name_match.group(1).strip()
                  if not re.fullmatch(r"[a-z0-9-]+", name):
                      problems.append(f"{path}: name must be lowercase-kebab-case, got {name!r}")
                  if name in names:
                      problems.append(f"{path}: duplicate name {name!r} (also in {names[name]})")
                  names[name] = path

              # The description is the routing signal - a vague one never gets invoked.
              desc_match = re.search(r"^description:\s*(.+(?:\n\s+.+)*)$", block, re.MULTILINE)
              if desc_match and len(desc_match.group(1).strip()) < 40:
                  problems.append(f"{path}: description must state when to use the agent (>= 40 chars)")

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print(f"OK - {len(paths)} subagent definitions valid: {', '.join(sorted(names))}")
          PY

      - name: Hook scripts are executable and parse
        run: |
          status=0
          for script in scripts/*.sh scripts/hooks/*.sh templates/hooks/*.sh; do
            [ -e "$script" ] || continue
            if [ ! -x "$script" ]; then
              echo "NOT EXECUTABLE: $script"
              status=1
            fi
            if ! bash -n "$script"; then
              echo "SYNTAX ERROR: $script"
              status=1
            fi
          done
          [ $status -eq 0 ] && echo "OK - all shell scripts executable and syntactically valid"
          exit $status

      - name: Repo hooks behave correctly
        run: |
          # The guard hook must block a generated file and allow the source.
          if echo '{"tool_input":{"file_path":"'"$PWD"'/CLAUDE.md"}}' \
             | ./scripts/hooks/guard-generated-files.sh 2>/dev/null; then
            echo "FAIL: guard hook did not block an edit to a generated mirror"
            exit 1
          fi
          if ! echo '{"tool_input":{"file_path":"'"$PWD"'/SKILL.md"}}' \
             | ./scripts/hooks/guard-generated-files.sh; then
            echo "FAIL: guard hook blocked an edit to SKILL.md"
            exit 1
          fi
          echo "OK - guard hook blocks mirrors and allows SKILL.md"

      - name: Swift templates have no placeholder stubs
        run: |
          if grep -rn --include='*.swift' -E '^\s*(// TODO|// FIXME|<#.*#>)' templates/; then
            echo "Template Swift files must be complete and compilable."
            exit 1
          fi
          echo "OK - no placeholder stubs in templates"

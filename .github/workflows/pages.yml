name: Publish landing page
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install discovery dependencies
        run: npm ci --prefix scripts/site-discovery --ignore-scripts
      - name: Install website renderer
        run: python3 -m pip install -r scripts/requirements-site.txt
      - name: Render illustrated blog and sitemap
        run: |
          python3 scripts/render-library.py
      - name: Sync features from README
        run: python3 scripts/render-site.py
      - name: Verify community section
        run: python3 scripts/render-community.py --check
      - name: Refresh total npm downloads
        run: python3 scripts/npm-downloads.py
      - name: Generate discovery files and page metadata
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/site-meta.mjs
      - name: Enforce site discovery
        run: node scripts/check-site-discovery.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow after successful deployment
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/site-indexnow.mjs

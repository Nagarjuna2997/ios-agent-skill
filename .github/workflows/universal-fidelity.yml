name: Experimental native conversion fidelity
on:
  push:
    branches: ['feat/universal-app-ir', 'feat/universal-typography']
    paths: ['mcp-server/src/app-ir/**', 'mcp-server/test/*', 'benchmarks/universal/**', '.github/workflows/universal-fidelity.yml']
  pull_request:
    paths: ['mcp-server/src/app-ir/**', 'benchmarks/universal/**', '.github/workflows/universal-fidelity.yml']
  workflow_dispatch:
    inputs:
      adapter:
        description: Static fixture adapter to verify
        type: choice
        options: [html, react-static, react-literal-props]
        default: html
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: universal-fidelity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mcp-server
      - run: npm run build --prefix mcp-server
      - run: node --test benchmarks/universal/fidelity/commands.test.mjs benchmarks/universal/render-evidence.test.mjs mcp-server/test/react-ir.test.js
      - run: node --test mcp-server/test/app-ir.test.js mcp-server/test/visual-gate.test.js mcp-server/test/measurements.test.js mcp-server/test/checkpoints.test.js mcp-server/test/known-good.test.js mcp-server/test/test-capture.test.js mcp-server/test/typography.test.js
  simulator:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      FIDELITY_ADAPTER: ${{ inputs.adapter || 'html' }}
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mcp-server
      - run: npm run build --prefix mcp-server
      - run: npm ci --prefix benchmarks/universal/fidelity
      - run: benchmarks/universal/fidelity/node_modules/.bin/playwright install chromium
      - run: node --test benchmarks/universal/fidelity/dom-typography.test.mjs
      - name: Exercise interruption after a completed native capture
        run: |
          set +e
          FIDELITY_INTERRUPT_AFTER=baseline-large node benchmarks/universal/fidelity/run.mjs benchmarks/universal/fidelity/ci.json "$RUNNER_TEMP/fidelity-evidence"
          status=$?
          set -e
          test "$status" -eq 1
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/fidelity-evidence/report.json"));if(r.error!=="Injected interruption after baseline-large")process.exit(1)'
      - name: Resume the native gate (review-required is not a pass)
        run: node benchmarks/universal/fidelity/run.mjs benchmarks/universal/fidelity/ci.json "$RUNNER_TEMP/fidelity-evidence" --resume
      - name: Preserve results and actual logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-fidelity-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/fidelity-evidence/report.json
            ${{ runner.temp }}/fidelity-evidence/setup-commands.jsonl
            ${{ runner.temp }}/fidelity-evidence/reference.png
            ${{ runner.temp }}/fidelity-evidence/reference-text.json
            ${{ runner.temp }}/fidelity-evidence/checkpoints/
            ${{ runner.temp }}/fidelity-evidence/*/measurement.json
            ${{ runner.temp }}/fidelity-evidence/*/normalized.png
            ${{ runner.temp }}/fidelity-evidence/repairs/
            ${{ runner.temp }}/fidelity-evidence/*/difference.png
            ${{ runner.temp }}/fidelity-evidence/*/.ios-agent/logs/
            ${{ runner.temp }}/fidelity-evidence/*/.ios-agent/screenshots/
            ${{ runner.temp }}/fidelity-evidence/*/.ios-agent/test-results/

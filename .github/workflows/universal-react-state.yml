name: Experimental React state and inputs
on:
  pull_request:
    paths:
      - 'mcp-server/src/app-ir/**'
      - 'mcp-server/src/agent/**'
      - 'mcp-server/package*.json'
      - 'mcp-server/test/react-state.test.js'
      - 'mcp-server/test/react-input.test.js'
      - 'benchmarks/universal/react-state/**'
      - 'benchmarks/universal/react-input/**'
      - 'benchmarks/universal/native-behavior/**'
      - 'benchmarks/universal/fidelity/ci.json'
      - 'benchmarks/universal/fidelity/commands.mjs'
      - '.github/workflows/universal-react-state.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: universal-react-state-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mcp-server
      - run: npm run build --prefix mcp-server
      - run: node --test mcp-server/test/react-input.test.js mcp-server/test/react-state.test.js mcp-server/test/react-ir.test.js mcp-server/test/app-ir.test.js benchmarks/universal/react-state/evidence.test.mjs benchmarks/universal/fidelity/commands.test.mjs
  simulator:
    strategy:
      fail-fast: false
      matrix:
        fixture: [react-state, react-input]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mcp-server
      - run: npm run build --prefix mcp-server
      - name: Build and test actual native state transitions
        run: node benchmarks/universal/${{ matrix.fixture }}/run.mjs benchmarks/universal/fidelity/ci.json "$RUNNER_TEMP/${{ matrix.fixture }}-evidence"
      - name: Preserve actual results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fixture }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/${{ matrix.fixture }}-evidence/report.json
            ${{ runner.temp }}/${{ matrix.fixture }}-evidence/checkpoints/
            ${{ runner.temp }}/${{ matrix.fixture }}-evidence/*-attachments-*/
            ${{ runner.temp }}/${{ matrix.fixture }}-evidence/app-*/.ios-agent/app-ir.json
            ${{ runner.temp }}/${{ matrix.fixture }}-evidence/app-*/.ios-agent/source-map.json
            ${{ runner.temp }}/${{ matrix.fixture }}-evidence/app-*/.ios-agent/logs/
            ${{ runner.temp }}/${{ matrix.fixture }}-evidence/app-*/.ios-agent/test-results/

name: CapabilityRuntime
options:
  bundleIdPrefix: dev.iosagent.fixture
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1'
targets:
  CapabilityRuntime:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: BUNDLE_PLACEHOLDER
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  RuntimeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CapabilityRuntime
  RuntimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CapabilityRuntime
schemes:
  CapabilityRuntime:
    build:
      targets:
        CapabilityRuntime: all
    test:
      targets: [RuntimeTests, RuntimeUITests]

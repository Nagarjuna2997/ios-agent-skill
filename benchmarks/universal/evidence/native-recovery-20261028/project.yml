# Generated by ios-agent from .ios-agent/spec.json. Edit the spec or use the agent tools, then regenerate.
name: "TripChecklist"
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  TripChecklist:
    type: "application"
    platform: "iOS"
    deploymentTarget: "17.0"
    sources:
      -
        path: "TripChecklist"
    configFiles:
      Debug: "Config/Base.xcconfig"
      Release: "Config/Base.xcconfig"
    info:
      path: "Config/Info.plist"
      properties:
        CFBundleDisplayName: "TripChecklist"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - "UIInterfaceOrientationPortrait"
          - "UIInterfaceOrientationLandscapeLeft"
          - "UIInterfaceOrientationLandscapeRight"
        "UISupportedInterfaceOrientations~ipad":
          - "UIInterfaceOrientationPortrait"
          - "UIInterfaceOrientationPortraitUpsideDown"
          - "UIInterfaceOrientationLandscapeLeft"
          - "UIInterfaceOrientationLandscapeRight"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.tripchecklist"
        PRODUCT_NAME: "TripChecklist"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: "Automatic"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  TripChecklistTests:
    type: "bundle.unit-test"
    platform: "iOS"
    deploymentTarget: "17.0"
    sources:
      -
        path: "TripChecklistTests"
    dependencies:
      -
        target: "TripChecklist"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.tripchecklist.tests"
        TARGETED_DEVICE_FAMILY: "1,2"
  TripChecklistUITests:
    type: "bundle.ui-testing"
    platform: "iOS"
    deploymentTarget: "17.0"
    sources:
      -
        path: "TripChecklistUITests"
    dependencies:
      -
        target: "TripChecklist"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.tripchecklist.uitests"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  TripChecklist:
    build:
      targets:
        TripChecklist: "all"
    test:
      targets:
        - "TripChecklistTests"
        - "TripChecklistUITests"
    run:
      config: "Debug"

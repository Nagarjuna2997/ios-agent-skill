# Generated by ios-agent from .ios-agent/spec.json. Edit the spec or use the agent tools, then regenerate.
name: "FoodDash"
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  lottie-spm:
    url: "https://github.com/airbnb/lottie-spm.git"
    from: "4.5.0"
targets:
  FoodDash:
    type: "application"
    platform: "iOS"
    deploymentTarget: "17.0"
    sources:
      -
        path: "FoodDash"
        excludes:
          - "Capabilities/Storekit2Paywall/Products.storekit"
          - "Capabilities/LiveActivity/Widget/**"
          - "Resources/IconLayers/**"
    configFiles:
      Debug: "Config/Base.xcconfig"
      Release: "Config/Base.xcconfig"
    info:
      path: "Config/Info.plist"
      properties:
        CFBundleDisplayName: "FoodDash"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: "LaunchBackground"
          UIImageName: "LaunchLogo"
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - "UIInterfaceOrientationPortrait"
        NSLocationWhenInUseUsageDescription: "Your location is used to show what is near you."
        NSSupportsLiveActivities: true
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        API_BASE_URL: "$(API_BASE_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.fooddash"
        PRODUCT_NAME: "FoodDash"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: "Automatic"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    entitlements:
      path: "Config/FoodDash.entitlements"
      properties:
        com.apple.developer.applesignin:
          - "Default"
    dependencies:
      -
        target: "FoodDashWidgets"
      -
        package: "lottie-spm"
        product: "Lottie"
  FoodDashWidgets:
    type: "app-extension"
    platform: "iOS"
    deploymentTarget: "17.0"
    sources:
      -
        path: "FoodDashWidgets"
      -
        path: "FoodDash/Capabilities/LiveActivity/Shared"
      -
        path: "FoodDash/Capabilities/LiveActivity/Widget"
    configFiles:
      Debug: "Config/Base.xcconfig"
      Release: "Config/Base.xcconfig"
    info:
      path: "Config/FoodDashWidgets-Info.plist"
      properties:
        CFBundleDisplayName: "FoodDash"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.fooddash.widgets"
        PRODUCT_NAME: "FoodDashWidgets"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: "Automatic"
schemes:
  FoodDash:
    build:
      targets:
        FoodDash: "all"
    run:
      config: "Debug"
      storeKitConfiguration: "FoodDash/Capabilities/Storekit2Paywall/Products.storekit"

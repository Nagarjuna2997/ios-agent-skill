# Generated by ios-agent from .ios-agent/spec.json. Edit the spec or use the agent tools, then regenerate.
name: "HabitTracker"
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  HabitTracker:
    type: "application"
    platform: "iOS"
    deploymentTarget: "17.0"
    sources:
      -
        path: "HabitTracker"
        excludes:
          - "Resources/IconLayers/**"
    configFiles:
      Debug: "Config/Base.xcconfig"
      Release: "Config/Base.xcconfig"
    info:
      path: "Config/Info.plist"
      properties:
        CFBundleDisplayName: "Habit Tracker"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - "UIInterfaceOrientationPortrait"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.habittracker"
        PRODUCT_NAME: "HabitTracker"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: "Automatic"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
schemes:
  HabitTracker:
    build:
      targets:
        HabitTracker: "all"
    run:
      config: "Debug"

# Generated by ios-agent from .ios-agent/spec.json. Edit the spec or use the agent tools, then regenerate.
name: "PocketNotes"
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  PocketNotes:
    type: "application"
    platform: "iOS"
    deploymentTarget: "17.0"
    sources:
      -
        path: "PocketNotes"
        excludes:
          - "Resources/IconLayers/**"
    configFiles:
      Debug: "Config/Base.xcconfig"
      Release: "Config/Base.xcconfig"
    info:
      path: "Config/Info.plist"
      properties:
        CFBundleDisplayName: "Pocket Notes"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - "UIInterfaceOrientationPortrait"
          - "UIInterfaceOrientationLandscapeLeft"
          - "UIInterfaceOrientationLandscapeRight"
        "UISupportedInterfaceOrientations~ipad":
          - "UIInterfaceOrientationPortrait"
          - "UIInterfaceOrientationPortraitUpsideDown"
          - "UIInterfaceOrientationLandscapeLeft"
          - "UIInterfaceOrientationLandscapeRight"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.pocketnotes"
        PRODUCT_NAME: "PocketNotes"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: "Automatic"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
  PocketNotesTests:
    type: "bundle.unit-test"
    platform: "iOS"
    deploymentTarget: "17.0"
    sources:
      -
        path: "PocketNotesTests"
    dependencies:
      -
        target: "PocketNotes"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.pocketnotes.tests"
        TARGETED_DEVICE_FAMILY: "1,2"
  PocketNotesUITests:
    type: "bundle.ui-testing"
    platform: "iOS"
    deploymentTarget: "17.0"
    sources:
      -
        path: "PocketNotesUITests"
    dependencies:
      -
        target: "PocketNotes"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.pocketnotes.uitests"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  PocketNotes:
    build:
      targets:
        PocketNotes: "all"
    test:
      targets:
        - "PocketNotesTests"
        - "PocketNotesUITests"
    run:
      config: "Debug"
